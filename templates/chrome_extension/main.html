<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Boostrap -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
          crossorigin="anonymous">
    <script type="module" src="bootstrap.bundle.js"></script>
    <script type="module" src="jquery-4.0.0.js"></script>
    <!-- Bootstrap END -->
    <title>Job applicant</title>
    <style>
        a {
            --bs-fg: inherit;
            color: var(--bs-fg);
            text-decoration: none;
        }
        html, body {
            font-size: 16px;
            height: 600px; /* Chrome extension maximum */
            width: 800px;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row p-4">
        <div class="col">
            <div id="error-alert"
                 class="alert theme-warning alert-dismissible d-none d-flex
                 justify-content-between"
                 role="alert">
                <p id="error-message"></p>
                <button id="error-close" type="button" class="btn-close"
                        aria-label="Close"></button>
            </div>
        </div>
    </div>
    <div class="row p-4 pt-0">
        <div class="col d-flex align-items-start gap-8">
            <div class="nav nav-pills nav-pills-vertical" id="v-pills-tab" role="tablist"
                 aria-orientation="vertical">
                <button class="nav-link" id="v-pills-linkdapi-tab" data-bs-toggle="tab"
                        data-bs-target="#v-pills-linkdapi" type="button" role="tab"
                        aria-controls="v-pills-linkdapi" aria-selected="false">
                    Linkdapi Key
                </button>
            </div>
            <div class="tab-content w-100" id="v-pills-tabContent">
                <div class="tab-pane" id="v-pills-linkdapi" role="tabpanel"
                     aria-labelledby="v-pills-linkdapi-tab" tabindex="0">
                    <form id="linkdapi-form" class="form" method="post">
                        <label for="linkdapi_key">Linkdapi Key</label>
                        <input type="password" id="linkdapi_key" name="linkdapi_key"
                               class="form-control">
                        <div class="text-center my-2">
                            <button class="btn btn-primary">Submit</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
